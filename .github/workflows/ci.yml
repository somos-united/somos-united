name: CI

# 02-DEPLOYMENT.md §4: on every PR, Turborepo builds only what changed,
# lint/typecheck/test must be green, Snyk/Socket block on critical findings,
# then Vercel creates its own preview deploy automatically (not this file's
# job). Merging to `main` (once green) triggers the Staging deploy.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  # -----------------------------------------------------------------------
  # E2E (apps/web only — 05-MODULE-BOOKING.md's booking/checkout flow doesn't
  # exist yet, but the locale-redirect + home page already do, so this has
  # real coverage rather than being deferred). Separate job from the one
  # above: e2e needs a production build + a running server first, unit tests
  # don't, and browser install is its own slow step worth isolating/caching
  # independently. Runs in parallel with lint/typecheck/test/build, not
  # chained after it — either failing blocks the merge the same way.
  # -----------------------------------------------------------------------
  e2e:
    name: E2E (Playwright — apps/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only (apps/web/playwright.config.ts) — local/CI browser
      # binaries only, no paid Playwright cloud service.
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run e2e (build + serve + test)
        run: pnpm turbo run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  # -----------------------------------------------------------------------
  # Security scans (01-ARCHITECTURE.md §9, 02-DEPLOYMENT.md §4): "Merge nach
  # main blockiert bei kritischen Findings." Neither account exists yet
  # (02-DEPLOYMENT.md §2 checklist) — these jobs are wired up but no-op
  # (skipped, not failed) until SNYK_TOKEN / SOCKET_SECURITY_API_KEY are
  # added as repo secrets, so CI never blocks on a missing account.
  # -----------------------------------------------------------------------
  snyk:
    name: Snyk (dependency security scan)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=critical --all-projects

  socket:
    name: Socket (dependency security scan)
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: SocketDev/socket-security-action does not exist on GitHub —
      # wire up the real Socket integration once the account exists
      # (docs/ACCOUNT-SETUP-CHECKLIST.md #6) and the correct action/setup is
      # confirmed from Socket's own docs. Placeholder fails loudly instead of
      # silently passing so this doesn't get forgotten.
      - name: Run Socket security scan
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        run: |
          echo "Socket security scan not yet wired up — see TODO above." >&2
          exit 1
